<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a192f">
  <meta name="description" content="AR Rakshak Safety System - AI-Powered Safety and Emergency Response for High-Risk Industries">
  <title>AR Rakshak Safety System</title>
  <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>
  <a href="#app" class="skip-link">Skip to main content</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">AR</span>
      <div class="brand-title">
        <b>AR Rakshak</b>
        <small>Safety System</small>
      </div>
    </div>
    <div class="top-actions">
      <span id="onlineBadge" class="badge online" role="status">● Online</span>
      <button class="icon-btn" id="themeToggleBtn" onclick="ThemeManager.toggle()" aria-label="Toggle dark/light mode">☾</button>
      <button class="icon-btn" id="langToggleBtn" onclick="showLanguageSelector()" aria-label="Select language">EN</button>
      <div class="user-menu" id="userMenu" style="display:none;">
        <button class="user-menu-btn" onclick="document.getElementById('userMenuDropdown').classList.toggle('show')">
          <span id="userMenuName">👤</span>
          <span id="userMenuRole"></span>
        </button>
        <div class="user-menu-dropdown" id="userMenuDropdown">
          <div class="user-menu-item" onclick="Router.navigate('profile')">👤 Profile</div>
          <div class="user-menu-item" onclick="showLanguageSelector()">🌐 Language</div>
          <div class="user-menu-item" onclick="ThemeManager.toggle()">☾ Theme</div>
          <div class="user-menu-item" onclick="AuthManager.signOut().then(()=>Router.navigate('login'))">🚪 Logout</div>
        </div>
      </div>
    </div>
  </header>

  <main id="app" role="main"></main>

  <nav class="bottom-nav" aria-label="Primary Navigation">
    <button data-nav="home" onclick="Router.navigate('home')" aria-label="Home">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span class="nav-label">Home</span>
    </button>
    <button data-nav="training" onclick="Router.navigate('training')" aria-label="Training">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10v6"/><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      <span class="nav-label">Training</span>
    </button>
    <button data-nav="simulator" onclick="Router.navigate('simulator')" aria-label="Simulator">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="m10 7 5 3-5 3z"/></svg>
      <span class="nav-label">Simulator</span>
    </button>
    <button data-nav="gps" onclick="Router.navigate('gps')" aria-label="GPS Tracker">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
      <span class="nav-label">GPS</span>
    </button>
    <button data-nav="sos" class="nav-sos" onclick="Router.navigate('sos')" aria-label="Emergency SOS">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18v-6a5 5 0 1 1 10 0v6"/><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"/><path d="M21 12h1"/><path d="M18.5 4.5 18 5"/><path d="M2 12h1"/><path d="M12 2v1"/><path d="m4.929 4.929.707.707"/><path d="M12 12v6"/></svg>
      <span class="nav-label">SOS</span>
    </button>
    <button data-nav="report" onclick="Router.navigate('report')" aria-label="Report Hazard">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <span class="nav-label">Report</span>
    </button>
    <button data-nav="assistant" onclick="Router.navigate('assistant')" aria-label="Rakshak Assistant">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
      <span class="nav-label">Assistant</span>
    </button>
    <button data-nav="checklist" onclick="Router.navigate('checklist')" aria-label="Safety Checklist">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
      <span class="nav-label">Checklist</span>
    </button>
    <button data-nav="passport" onclick="Router.navigate('passport')" aria-label="My Profile">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/></svg>
      <span class="nav-label">My Profile</span>
    </button>
    <button data-nav="supervisor" onclick="Router.navigate('supervisor')" aria-label="Supervisor Dashboard" id="navSupervisor" style="display:none;">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
      <span class="nav-label">Supervisor</span>
    </button>
  </nav>

  <script src="/js/config.js?v=3"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/theme.js?v=3"></script>
  <script src="/js/router.js?v=3"></script>
  <script src="/js/auth.js?v=3"></script>
  <script src="/js/storage.js?v=3"></script>
  <script src="/js/api.js?v=3"></script>
  <script src="/js/camera.js?v=3"></script>
  <script src="/js/ui.js?v=3"></script>
  <script src="/js/worker.js?v=3"></script>
  <script src="/js/training.js?v=3"></script>
  <script src="/js/incident.js?v=3"></script>
  <script src="/js/dashboard.js?v=3"></script>
  <script src="/js/certificate.js?v=3"></script>
  <script src="/js/gps.js?v=3"></script>
  <script src="/js/sos.js?v=3"></script>
  <script src="/js/assistant.js?v=3"></script>
  <script src="/js/checklist.js?v=3"></script>
  <script src="/js/passport.js?v=3"></script>
  <script src="/js/simulator.js?v=3"></script>
  <script src="/js/analytics.js?v=3"></script>
  <script src="/js/app.js?v=3"></script>
</body>
</html>
