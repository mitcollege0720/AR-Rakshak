<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a192f">
  <meta name="description" content="AR-RAKSHAK Smart Safety Training Platform for Mining & Manufacturing Workers (SIH 2026)">
  <title>AR-RAKSHAK | Smart Safety Training Platform</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a href="#app" class="skip-link">Skip to main content</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">AR</span>
      <div class="brand-title">
        <b>AR-RAKSHAK</b>
        <small>Smart Safety Training</small>
      </div>
    </div>
    <div class="top-actions">
      <span id="onlineBadge" class="badge online" role="status">● Online</span>
      <button class="icon-btn" id="langToggleBtn" onclick="toggleLang()" aria-label="Switch between English and Hindi">
        अ / English
      </button>
    </div>
  </header>

  <main id="app" role="main"></main>

  <nav class="bottom-nav" aria-label="Primary Navigation">
    <button data-nav="home" onclick="showHome()" aria-label="Home Dashboard">
      <span aria-hidden="true">⌂</span>
      <span>Home</span>
    </button>
    <button data-nav="training" onclick="showTraining()" aria-label="Safety Training Modules">
      <span aria-hidden="true">◈</span>
      <span>Training</span>
    </button>
    <button data-nav="scan" onclick="showScan()" aria-label="Scan Safety Zone QR">
      <span aria-hidden="true">▣</span>
      <span>Scan Zone</span>
    </button>
    <button data-nav="report" onclick="showReport()" aria-label="Report Hazard or Incident">
      <span aria-hidden="true">⚠</span>
      <span>Report</span>
    </button>
    <button data-nav="supervisor" onclick="showAdmin()" aria-label="Supervisor Compliance Dashboard">
      <span aria-hidden="true">▤</span>
      <span>Supervisor</span>
    </button>
  </nav>

  <!-- Modular Scripts -->
  <script src="/js/i18n.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/camera.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/worker.js"></script>
  <script src="/js/training.js"></script>
  <script src="/js/incident.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/certificate.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
