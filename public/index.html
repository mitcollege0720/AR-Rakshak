<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a192f">
  <meta name="description" content="AR Rakshak Safety System - AI-Powered Safety and Emergency Response for High-Risk Industries">
  <title>AR Rakshak Safety System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a href="#app" class="skip-link">Skip to main content</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">AR</span>
      <div class="brand-title">
        <b>AR Rakshak</b>
        <small>Safety System</small>
      </div>
    </div>
    <div class="top-actions">
      <span id="onlineBadge" class="badge online" role="status">● Online</span>
      <button class="icon-btn" id="themeToggleBtn" onclick="ThemeManager.toggle()" aria-label="Toggle dark/light mode">☾</button>
      <button class="icon-btn" id="langToggleBtn" onclick="showLanguageSelector()" aria-label="Select language">EN</button>
      <div class="user-menu" id="userMenu" style="display:none;">
        <button class="user-menu-btn" onclick="document.getElementById('userMenuDropdown').classList.toggle('show')">
          <span id="userMenuName">👤</span>
          <span id="userMenuRole"></span>
        </button>
        <div class="user-menu-dropdown" id="userMenuDropdown">
          <div class="user-menu-item" onclick="Router.navigate('profile')">👤 Profile</div>
          <div class="user-menu-item" onclick="showLanguageSelector()">🌐 Language</div>
          <div class="user-menu-item" onclick="ThemeManager.toggle()">☾ Theme</div>
          <div class="user-menu-item" onclick="AuthManager.signOut().then(()=>Router.navigate('login'))">🚪 Logout</div>
        </div>
      </div>
    </div>
  </header>

  <main id="app" role="main"></main>

  <nav class="bottom-nav" aria-label="Primary Navigation">
    <button data-nav="home" onclick="Router.navigate('home')" aria-label="Home">
      <span aria-hidden="true">⌂</span><span>Home</span>
    </button>
    <button data-nav="training" onclick="Router.navigate('training')" aria-label="Training">
      <span aria-hidden="true">◈</span><span>Training</span>
    </button>
    <button data-nav="simulator" onclick="Router.navigate('simulator')" aria-label="Simulator">
      <span aria-hidden="true">🎮</span><span>Simulator</span>
    </button>
    <button data-nav="gps" onclick="Router.navigate('gps')" aria-label="GPS Tracker">
      <span aria-hidden="true">📡</span><span>GPS</span>
    </button>
    <button data-nav="sos" onclick="Router.navigate('sos')" aria-label="Emergency SOS">
      <span aria-hidden="true">🆘</span><span>SOS</span>
    </button>
    <button data-nav="report" onclick="Router.navigate('report')" aria-label="Report Hazard">
      <span aria-hidden="true">⚠</span><span>Report</span>
    </button>
    <button data-nav="assistant" onclick="Router.navigate('assistant')" aria-label="Rakshak Assistant">
      <span aria-hidden="true">🤖</span><span>Assistant</span>
    </button>
    <button data-nav="checklist" onclick="Router.navigate('checklist')" aria-label="Safety Checklist">
      <span aria-hidden="true">✅</span><span>Checklist</span>
    </button>
    <button data-nav="passport" onclick="Router.navigate('passport')" aria-label="Safety Passport">
      <span aria-hidden="true">🛂</span><span>Passport</span>
    </button>
    <button data-nav="supervisor" onclick="Router.navigate('supervisor')" aria-label="Supervisor Dashboard" id="navSupervisor" style="display:none;">
      <span aria-hidden="true">▤</span><span>Supervisor</span>
    </button>
  </nav>

  <script src="/js/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/storage.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/camera.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/worker.js"></script>
  <script src="/js/training.js"></script>
  <script src="/js/incident.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/certificate.js"></script>
  <script src="/js/gps.js"></script>
  <script src="/js/sos.js"></script>
  <script src="/js/assistant.js"></script>
  <script src="/js/checklist.js"></script>
  <script src="/js/passport.js"></script>
  <script src="/js/simulator.js"></script>
  <script src="/js/analytics.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
